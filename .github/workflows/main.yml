name: Build RayZR Care APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack RayZR Care project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -o RayZR-Care-v0.2.zip -d build-project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: build-project/RayZR-Care
        run: gradle assembleDebug

      - name: Upload RayZR Care APK
        uses: actions/upload-artifact@v4
        with:
          name: RayZR-Care-APK
          path: build-project/RayZR-Care/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
